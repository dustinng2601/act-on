[package]
name = "act-on"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["SoundSeek <legal@soundseek.org>"]
license = "MIT"
description = "Run GitHub Actions on your own devices + GitHub CI / enterprise pools. Cross-platform local sandbox runner with policy-based device assignment. Rust implementation inspired by nektos/act."
homepage = "https://github.com/sd2ek/act-on"
repository = "https://github.com/sd2ek/act-on"
documentation = "https://github.com/sd2ek/act-on#readme"
readme = "README.md"
keywords = ["github-actions", "ci", "runner", "sandbox", "self-hosted"]
categories = ["command-line-utilities", "development-tools", "development-tools::build-utils"]
exclude = ["/.github", "/target", "/docs", "*.bak"]

[[bin]]
name = "act-on"
path = "src/main.rs"

[lib]
name = "act_on"
path = "src/lib.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env", "cargo"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# Errors
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "time"] }

# Misc
once_cell = "1.20"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
indexmap = { version = "2.5", features = ["serde"] }

# Platform detection
cfg-if = "1.0"

# Process / shell
shell-words = "1.1"

# Concurrency primitives
parking_lot = "0.12"

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
