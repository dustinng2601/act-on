# SonarQube Cloud project binding.
#
# Names the project so a scan does not have to be told each time, whether it is
# run from a terminal or from CI. The organization is the personal one rather
# than sd2ek, because this repository lives on that account.
sonar.projectKey=dustinng2601_act-on
sonar.organization=dustinng2601

sonar.sources=src
sonar.tests=src
# Rust keeps unit tests beside the code they exercise, so the same paths are
# both sources and tests; this is what tells Sonar which is which.
sonar.test.inclusions=**/tests.rs,**/*_test.rs,**/tests/**
sonar.exclusions=target/**,**/*.png,**/*.ico,**/*.icns

sonar.sourceEncoding=UTF-8
