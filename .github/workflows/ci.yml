name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pushing again supersedes the previous run: only the newest answer is read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Linux only. macOS bills at ten times a Linux minute and Windows at twice,
  # and this project's platform-specific code is a handful of `cfg` blocks —
  # not worth an order of magnitude on every push. Add the other platforms when
  # there is something that genuinely only breaks there.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test
